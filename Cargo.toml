[package]
name = "merlin"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An AI agent for Matrix"
repository = "https://github.com/s1dny/merlin"

[dependencies]
mxlink = "1.15"
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "process",
] }
anyhow = "1.0.104"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "stream",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
tokio-cron-scheduler = "0.15.1"
sha2 = "0.10"
base64 = "0.23"
uuid = { version = "1.26", features = ["v4"] }
regex = "1.13"
html2text = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rapidfuzz = "0.5.0"
sqlite-vec = "0.1.9"
futures-util = { version = "0.3.34", default-features = false, features = [
    "std",
] }

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
