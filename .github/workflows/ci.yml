name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: test and lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Superseded lint runs are worth nothing, so a newer push cancels them.
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # aws-lc-sys arrives through rustls, which matrix-sdk selects with no
      # opt-out, and it needs cmake at build time.
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    name: build and publish
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Deliberately not cancelled. A build that is killed before it publishes
    # leaves the cache empty, so the next build is slow too and the cache never
    # warms up. Letting it finish is what makes every later build a download.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: false
    # Secrets are unavailable to a step-level `if`, so the decision is made once
    # here, at job level, where the secrets context does resolve.
    env:
      CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME || 'merlin' }}
      HAVE_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: install cachix
        run: nix profile install nixpkgs#cachix

      - run: nix build .#merlin --print-build-logs
      - run: nix build .#merlin-sandbox --print-build-logs

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
      # which is what bubblewrap needs. The knob does not exist on every kernel,
      # so its absence is fine and only a failure to clear a present one is not.
      - name: allow unprivileged user namespaces
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "no AppArmor userns restriction on this runner"
          fi

      - name: sandbox smoke test
        run: |
          set -euo pipefail
          root=$(mktemp -d)/root
          work=$(mktemp -d)
          mkdir -p "$root"
          tar -xzf "$(nix build .#sandbox-rootfs --no-link --print-out-paths)" -C "$root"
          printf 'nameserver 1.1.1.1\n' > "$root/etc/resolv.conf"

          out=$(echo 'echo $((6*7)); pwd' \
            | MERLIN_SANDBOX_ROOT="$root" MERLIN_WORKSPACE="$work" \
              ./result/bin/merlin-sandbox)
          echo "sandbox said: $out"
          [ "$(echo "$out" | sed -n 1p)" = "42" ] || { echo "arithmetic failed"; exit 1; }
          [ "$(echo "$out" | sed -n 2p)" = "/work" ] || { echo "wrong working directory"; exit 1; }

      # Pushed explicitly rather than through cachix-action. The action always
      # runs `cachix use` first, which needs a read authorization this push
      # token does not carry, and skipping that step leaves its post-build hook
      # pointing at a daemon that was never started.
      - name: publish the closure
        if: env.HAVE_TOKEN == 'yes'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          nix build .#merlin --no-link --print-out-paths | cachix push "$CACHE_NAME"
          nix build .#merlin-sandbox --no-link --print-out-paths | cachix push "$CACHE_NAME"
          nix build .#sandbox-rootfs --no-link --print-out-paths | cachix push "$CACHE_NAME"
