name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # aws-lc-sys arrives through rustls, which matrix-sdk selects with no
      # opt-out, and it needs cmake at build time.
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    name: build and publish
    runs-on: ubuntu-latest
    # Secrets are unavailable to a step-level `if`, so the decision is made once
    # here, at job level, where the secrets context does resolve.
    env:
      CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME || 's1dny' }}
      HAVE_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Pushing the closure is what turns a deploy into a download. Without a
      # token the build still runs, it just is not shared.
      - uses: cachix/cachix-action@v16
        if: env.HAVE_TOKEN == 'yes'
        with:
          name: ${{ env.CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build .#merlin --print-build-logs
      - run: nix build .#merlin-sandbox --print-build-logs

      # Ubuntu 24.04 runners restrict unprivileged user namespaces through
      # AppArmor, which is exactly what bubblewrap needs. Without this the
      # sandbox cannot start and the smoke test fails on the runner rather than
      # on anything wrong with the sandbox.
      - name: allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: sandbox smoke test
        run: |
          set -euo pipefail
          root=$(mktemp -d)/root
          work=$(mktemp -d)
          mkdir -p "$root"
          tar -xzf "$(nix build .#sandbox-rootfs --no-link --print-out-paths)" -C "$root"
          printf 'nameserver 1.1.1.1\n' > "$root/etc/resolv.conf"

          out=$(echo 'echo $((6*7)); pwd' \
            | MERLIN_SANDBOX_ROOT="$root" MERLIN_WORKSPACE="$work" \
              ./result/bin/merlin-sandbox bash)
          echo "sandbox said: $out"
          [ "$(echo "$out" | sed -n 1p)" = "42" ] || { echo "arithmetic failed"; exit 1; }
          [ "$(echo "$out" | sed -n 2p)" = "/work" ] || { echo "wrong working directory"; exit 1; }
